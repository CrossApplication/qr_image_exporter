name: qr_image_exporter
description: An extension for the `qr.dart` package that provides a simple and robust way to export QR code modules as customizable PNG byte data.

version: 1.0.0
repository: https://github.com/CrossApplication/qr_image_exporter

environment:
  sdk: ^3.8.1

dependencies:
  qr: ^3.0.2
  image: ^4.5.4

dev_dependencies:
  lints: ^5.1.1
  test: ^1.26.3
  path: ^1.9.1